<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>테트리스 게임</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="game-wrap">
    <section class="game-card">
      <header class="game-header">
        <div>
          <p class="eyebrow">BLOCK PUZZLE</p>
          <h1>테트리스</h1>
        </div>
        <button id="pauseButton" class="small-button" type="button">일시정지</button>
      </header>

      <div class="game-layout">
        <div class="board-area">
          <canvas id="gameCanvas" width="300" height="600" aria-label="테트리스 게임 화면"></canvas>
          <div id="gameOverlay" class="game-overlay">
            <h2 id="overlayTitle">테트리스</h2>
            <p id="overlayText">게임 시작 버튼을 눌러주세요.</p>
          </div>
        </div>

        <aside class="side-panel">
          <div class="info-box">
            <span>점수</span>
            <strong id="score">0</strong>
          </div>

          <div class="info-row">
            <div class="info-box">
              <span>레벨</span>
              <strong id="level">1</strong>
            </div>
            <div class="info-box">
              <span>라인</span>
              <strong id="lines">0</strong>
            </div>
          </div>

          <div class="next-box">
            <span>다음 블록</span>
            <canvas id="nextCanvas" width="120" height="120"></canvas>
          </div>

          <button id="startButton" class="start-button" type="button">게임 시작</button>

          <div class="guide">
            <h2>조작 방법</h2>
            <p>← → 블록 이동</p>
            <p>↓ 빠르게 내리기</p>
            <p>↑ 블록 회전</p>
            <p>Space 즉시 내리기</p>
            <p>P 일시정지</p>
          </div>
        </aside>
      </div>

      <div class="mobile-controls" aria-label="모바일 조작 버튼">
        <button data-action="left" type="button">←</button>
        <button data-action="rotate" type="button">↻</button>
        <button data-action="right" type="button">→</button>
        <button data-action="down" type="button">↓</button>
        <button data-action="drop" class="wide" type="button">DROP</button>
      </div>
    </section>
  </main>

  <script src="./script.js"></script>
</body>
</html>
