<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>설화수 추천 Banner Slider</title>

    <!-- =========================================================
         Google Fonts : Noto Sans KR
         폰트 로딩이 늦더라도 시스템 한글 폰트로 먼저 표시됩니다.
    ========================================================== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- =========================================================
         Swiper CSS
         버전을 11로 고정해서 GitHub Pages에서도 버전 변화로
         레이아웃이 달라지는 문제를 줄였습니다.
    ========================================================== -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">

    <!-- =========================================================
         직접 작성한 CSS
         ./ 로 시작하는 상대경로를 사용하여 GitHub Project Pages에서도
         저장소 이름과 관계없이 경로가 정상 동작하도록 했습니다.
         파일명도 기존 style.css와 겹치지 않도록 변경했습니다.
    ========================================================== -->
    <link rel="stylesheet" href="./css/sulwhasoo-slider.css?v=20260821-4">
</head>
<body>

    <!-- =========================================================
         설화수 추천 BANNER SLIDER SECTION
         - 전체 너비 : 100%
         - inner : 최대 1440px
         - section 높이 : 950px
         - slide 영역 높이 : 600px
         - 총 6개 / 한 화면에 3개 / 한 번에 1개 이동
    ========================================================== -->
    <section class="sul-recommend-section">
        <div class="sul-recommend-inner">

            <!-- 섹션 제목 : 28px -->
            <h2 class="sul-section-title">설화수 추천</h2>

            <!-- =================================================
                 슬라이드 영역
            ================================================== -->
            <div class="sul-slider-area">

                <!-- Swiper 본체 -->
                <div class="swiper sulwhasoo-product-swiper">
                    <div class="swiper-wrapper">

                        <!-- Slide 01 : 이미지 교체 경로 ./imges/banner01.png -->
                        <article class="swiper-slide sul-product-card">
                            <a href="#" class="sul-product-link">
                                <div class="sul-product-image">
                                    <img src="./imges/banner01.png" alt="탄력크림 EX">
                                </div>
                                <div class="sul-product-info">
                                    <h3>탄력크림 EX</h3>
                                    <p>Essential Firming Cream EX</p>
                                    <strong>100,000원</strong>
                                </div>
                            </a>
                        </article>

                        <!-- Slide 02 : 이미지 교체 경로 ./imges/banner02.png -->
                        <article class="swiper-slide sul-product-card">
                            <a href="#" class="sul-product-link">
                                <div class="sul-product-image">
                                    <img src="./imges/banner02.png" alt="자정기미코렉터">
                                </div>
                                <div class="sul-product-info">
                                    <h3>자정기미코렉터</h3>
                                    <p>Lumiwise Discoloration Corrector</p>
                                    <strong>150,000원</strong>
                                </div>
                            </a>
                        </article>

                        <!-- Slide 03 : 이미지 교체 경로 ./imges/banner03.png -->
                        <article class="swiper-slide sul-product-card">
                            <a href="#" class="sul-product-link">
                                <div class="sul-product-image">
                                    <img src="./imges/banner03.png" alt="퍼펙팅 쿠션 에어리">
                                </div>
                                <div class="sul-product-info">
                                    <h3>퍼펙팅 쿠션 에어리</h3>
                                    <p>Perfecting Cushion Airy</p>
                                    <strong>89,000원</strong>
                                </div>
                            </a>
                        </article>

                        <!-- Slide 04 : 이전/다음 이동 시 나타나는 추가 상품 -->
                        <article class="swiper-slide sul-product-card">
                            <a href="#" class="sul-product-link">
                                <div class="sul-product-image">
                                    <img src="./imges/banner04.png" alt="윤조아이세럼">
                                </div>
                                <div class="sul-product-info">
                                    <h3>윤조아이세럼</h3>
                                    <p>First Care Activating Eye Serum</p>
                                    <strong>115,000원</strong>
                                </div>
                            </a>
                        </article>

                        <!-- Slide 05 -->
                        <article class="swiper-slide sul-product-card">
                            <a href="#" class="sul-product-link">
                                <div class="sul-product-image">
                                    <img src="./imges/banner05.png" alt="여윤팩">
                                </div>
                                <div class="sul-product-info">
                                    <h3>여윤팩</h3>
                                    <p>Overnight Recharging Mask</p>
                                    <strong>70,000원</strong>
                                </div>
                            </a>
                        </article>

                        <!-- Slide 06 -->
                        <article class="swiper-slide sul-product-card">
                            <a href="#" class="sul-product-link">
                                <div class="sul-product-image">
                                    <img src="./imges/banner06.png" alt="순행클렌징폼">
                                </div>
                                <div class="sul-product-info">
                                    <h3>순행클렌징폼</h3>
                                    <p>Gentle Cleansing Foam</p>
                                    <strong>67,000원</strong>
                                </div>
                            </a>
                        </article>

                    </div>
                </div>

                <!-- 왼쪽 이전 버튼 : 시안처럼 첫 번째 이미지 왼쪽 위에 겹쳐 배치 -->
                <button type="button" class="sul-slider-nav sul-slider-prev" aria-label="이전 상품 보기">
                    <span aria-hidden="true"></span>
                </button>

                <!-- 오른쪽 다음 버튼 : 시안처럼 세 번째 이미지 오른쪽 위에 겹쳐 배치 -->
                <button type="button" class="sul-slider-nav sul-slider-next" aria-label="다음 상품 보기">
                    <span aria-hidden="true"></span>
                </button>
            </div>

            <!-- =================================================
                 진행 막대 + 일시정지 / 재생 버튼
                 버튼 이미지는 imges 폴더에서 직접 교체 가능합니다.
            ================================================== -->
            <div class="sul-slider-controller" aria-label="슬라이드 재생 제어">
                <div class="sul-progress-track" aria-hidden="true">
                    <span class="sul-progress-fill"></span>
                </div>

                <!-- 일시정지 이미지 : ./imges/icon-pause.png -->
                <button type="button" class="sul-control-btn sul-pause-btn" aria-label="자동 슬라이드 일시정지">
                    <img src="./imges/icon-pause.png" alt="">
                </button>

                <!-- 재생 이미지 : ./imges/icon-play.png -->
                <button type="button" class="sul-control-btn sul-play-btn" aria-label="자동 슬라이드 재생">
                    <img src="./imges/icon-play.png" alt="">
                </button>
            </div>

        </div>
    </section>

    <!-- =========================================================
         Swiper JS
         CDN이 정상 로드되면 Swiper로 작동합니다.
         CDN이 차단되어도 아래 직접 작성한 JS의 폴백 기능으로
         3초 자동 슬라이드가 계속 동작하도록 구현했습니다.
    ========================================================== -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <!-- 직접 작성한 JS : 캐시 충돌 방지를 위해 새 파일명 + 버전값 사용 -->
    <script src="./js/sulwhasoo-slider.js?v=20260821-4"></script>
</body>
</html>
