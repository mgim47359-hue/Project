<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>집반찬연구소 - 2개 섹션</title>

    <!-- 집반찬연구소 2개 섹션 전용 CSS -->
    <link rel="stylesheet" href="./css/style.css?v=2.0">
</head>
<body>

    <!-- =========================================================
         SECTION 01 : 메인 배너 슬라이드
         - 첨부한 배너 4장이 3초마다 자동으로 변경됩니다.
         - 기존 홈페이지의 Header / 메뉴 / 카테고리는 포함하지 않았습니다.
    ========================================================== -->
    <section class="jp-main-slider" aria-label="집반찬연구소 메인 배너">
        <div class="jp-main-slider__viewport">
            <div class="jp-main-slider__track">
                <div class="jp-main-slider__slide">
                    <img src="./imges/slide-01.png" alt="간편 5분 식탁 배너">
                </div>
                <div class="jp-main-slider__slide">
                    <img src="./imges/slide-02.png" alt="신규회원 혜택 배너">
                </div>
                <div class="jp-main-slider__slide">
                    <img src="./imges/slide-03.png" alt="정기식단 배너">
                </div>
                <div class="jp-main-slider__slide">
                    <img src="./imges/slide-04.png" alt="무라벨 생수 배너">
                </div>
            </div>
        </div>

        <!-- 왼쪽 / 오른쪽 이동 버튼 -->
        <div class="jp-main-slider__nav" aria-label="배너 이동 버튼">
            <button class="jp-main-slider__button jp-main-slider__button--prev" type="button" aria-label="이전 배너">‹</button>
            <button class="jp-main-slider__button jp-main-slider__button--next" type="button" aria-label="다음 배너">›</button>
        </div>

        <!-- 현재 슬라이드 번호 -->
        <div class="jp-main-slider__counter" aria-live="polite">
            <strong class="jp-main-slider__current">1</strong>
            <span>/</span>
            <span class="jp-main-slider__total">4</span>
        </div>
    </section>

    <!-- =========================================================
         SECTION 02 : 여름휴가도, 집반찬 상품 화면
         - 요청한 두 번째 화면만 아래에 배치했습니다.
         - 이미지를 바꾸려면 ./imges/product-section.png만 교체하세요.
    ========================================================== -->
    <section class="jp-product-section" aria-label="여름휴가도 집반찬 상품 목록">
        <img
            class="jp-product-section__image"
            src="./imges/product-section.png"
            alt="여름휴가도 집반찬 상품 목록"
        >
    </section>

    <!-- 집반찬연구소 2개 섹션 전용 JavaScript -->
    <script src="./js/script.js?v=2.0"></script>
</body>
</html>
