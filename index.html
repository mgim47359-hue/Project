<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0,
        maximum-scale=1.0, minimum-scale=1.0,
        user-scalable=no, viewport-fit=cover"
    >

    <title>캠핑 장소 검색 결과</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            min-width: 320px;
            overflow: hidden;
            font-family:
                Pretendard,
                "Noto Sans KR",
                Arial,
                sans-serif;
            color: #111;
            background: #fff;
        }

        button {
            margin: 0;
            padding: 0;
            border: 0;
            font: inherit;
            color: inherit;
            background: transparent;
            cursor: pointer;
        }

        img {
            display: block;
        }

        /* 모바일 앱 전체 영역 */
        .app {
            position: relative;
            width: 100%;
            height: 100svh;
            overflow: hidden;
            background: #fff;
        }

        /* 공통 화면 */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition:
                transform 0.35s ease,
                visibility 0.35s ease;
        }

        /* ==============================
           검색 결과 화면
        ============================== */

        .search-screen {
            z-index: 2;
            display: flex;
            flex-direction: column;
            visibility: visible;
            transform: translateX(0);
            background: #fff;
        }

        .search-screen.hide {
            visibility: hidden;
            transform: translateX(-100%);
        }

        /* 상단 헤더 */
        .header {
            position: relative;
            flex-shrink: 0;
            width: 100%;
            height: 81px;
            border-bottom: 1px solid #ededed;
            background: #fff;
        }

        .header-title {
            position: absolute;
            left: 50%;
            bottom: 14px;
            font-size: 18px;
            font-weight: 700;
            line-height: 26px;
            white-space: nowrap;
            transform: translateX(-50%);
        }

        .header-back {
            position: absolute;
            left: 24px;
            bottom: 17px;
            width: 24px;
            height: 24px;
        }

        .header-back img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* 검색 결과 스크롤 영역 */
        .result-list {
            flex: 1;
            width: 100%;
            overflow-x: hidden;
            overflow-y: auto;
            overscroll-behavior: contain;
            scrollbar-width: none;
        }

        .result-list::-webkit-scrollbar {
            display: none;
        }

        /* 장소 한 줄 */
        .result-item {
            position: relative;
            display: flex;
            width: 100%;
            min-height: 148px;
            padding: 24px;
            border-bottom: 1px solid #ededed;
            text-align: left;
            background: #fff;
        }

        .result-item:active {
            background: #f8f8f8;
        }

        .place-image {
            flex-shrink: 0;
            width: 100px;
            height: 100px;
            overflow: hidden;
            border-radius: 8px;
            background: #eee;
        }

        .place-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .place-info {
            min-width: 0;
            flex: 1;
            padding-left: 14px;
            padding-right: 4px;
        }

        .place-name {
            overflow: hidden;
            padding-right: 32px;
            font-size: 17px;
            font-weight: 700;
            line-height: 24px;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .place-address {
            display: -webkit-box;
            overflow: hidden;
            min-height: 40px;
            margin-top: 1px;
            padding-right: 25px;
            font-size: 13px;
            font-weight: 400;
            line-height: 20px;
            color: #222;
            word-break: keep-all;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
        }

        .place-option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            margin-top: 12px;
        }

        .tag-list {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .tag {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 25px;
            padding: 0 9px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            color: #fff;
            white-space: nowrap;
            background: #5878bd;
        }

        .distance {
            margin-left: auto;
            font-size: 16px;
            font-weight: 500;
            line-height: 24px;
            color: #4f70bb;
            white-space: nowrap;
        }

        .bookmark {
            position: absolute;
            top: 28px;
            right: 27px;
            z-index: 2;
            width: 18px;
            height: 22px;
        }

        .bookmark img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* ==============================
           하단 내비게이션
        ============================== */

        .bottom-navigation {
            flex-shrink: 0;
            display: flex;
            width: 100%;
            height: calc(79px + env(safe-area-inset-bottom));
            padding-top: 9px;
            padding-bottom: env(safe-area-inset-bottom);
            border-top: 1px solid #ededed;
            background: #fff;
        }

        .navigation-button {
            width: 20%;
            text-align: center;
        }

        .navigation-icon {
            width: 24px;
            height: 24px;
            margin: 0 auto 4px;
            object-fit: contain;
        }

        .navigation-text {
            display: block;
            font-size: 15px;
            font-weight: 600;
            line-height: 22px;
            color: #111;
        }

        .navigation-button.active .navigation-text {
            color: #5274bd;
        }

        /* ==============================
           지도 화면
        ============================== */

        .map-screen {
            z-index: 3;
            visibility: hidden;
            transform: translateX(100%);
            background: #dceef0;
        }

        .map-screen.show {
            visibility: visible;
            transform: translateX(0);
        }

        #map {
            width: 100%;
            height: 100%;
            background: #dceef0;
        }

        /* 지도에서 목록으로 돌아가는 이미지 버튼 */
        .map-back-button {
            position: absolute;
            top: calc(18px + env(safe-area-inset-top));
            left: 18px;
            z-index: 20;
            width: 42px;
            height: 42px;
            padding: 10px;
            border-radius: 50%;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.2);
            background: #fff;
        }

        .map-back-button img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* 지도 오류 안내 */
        .map-error {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 30px;
            font-size: 14px;
            line-height: 1.7;
            text-align: center;
            color: #555;
            background: #e3f1f3;
        }
    </style>
</head>

<body>
    <main class="app">

        <!-- 검색 결과 화면 -->
        <section
            class="screen search-screen"
            id="searchScreen"
        >
            <header class="header">
                <button
                    type="button"
                    class="header-back"
                    aria-label="이전 화면"
                >
                    <img
                        src="./images/arrow.svg"
                        alt=""
                    >
                </button>

                <h1 class="header-title">검색결과</h1>
            </header>

            <div
                class="result-list"
                id="resultList"
            >
                <!-- JavaScript로 장소 목록 생성 -->
            </div>

            <nav
                class="bottom-navigation"
                aria-label="하단 메뉴"
            >
                <button
                    type="button"
                    class="navigation-button"
                >
                    <img
                        class="navigation-icon"
                        src="./images/icon-home.png"
                        alt=""
                    >
                    <span class="navigation-text">홈</span>
                </button>

                <button
                    type="button"
                    class="navigation-button active"
                >
                    <img
                        class="navigation-icon"
                        src="./images/icon-search.png"
                        alt=""
                    >
                    <span class="navigation-text">검색</span>
                </button>

                <button
                    type="button"
                    class="navigation-button"
                >
                    <img
                        class="navigation-icon"
                        src="./images/icon-group.png"
                        alt=""
                    >
                    <span class="navigation-text">모임</span>
                </button>

                <button
                    type="button"
                    class="navigation-button"
                >
                    <img
                        class="navigation-icon"
                        src="./images/icon-live.png"
                        alt=""
                    >
                    <span class="navigation-text">LIVE</span>
                </button>

                <button
                    type="button"
                    class="navigation-button"
                >
                    <img
                        class="navigation-icon"
                        src="./images/icon-my.png"
                        alt=""
                    >
                    <span class="navigation-text">MY</span>
                </button>
            </nav>
        </section>

        <!-- 카카오맵 화면 -->
        <section
            class="screen map-screen"
            id="mapScreen"
        >
            <div id="map"></div>

            <button
                type="button"
                class="map-back-button"
                id="mapBackButton"
                aria-label="검색 결과로 돌아가기"
            >
                <img
                    src="./images/icon-back.png"
                    alt=""
                >
            </button>
        </section>
    </main>

    <!--
        YOUR_JAVASCRIPT_KEY를
        자신의 카카오맵 JavaScript 키로 변경하세요.
    -->
    <script
        src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=c1150e850c41fd7881e31f1d2ab6391e"
    ></script>

    <script>
        "use strict";

        const places = [
            {
                id: 1,
                name: "망원한강공원",
                address: "서울 마포구 망원동 205-4",
                tags: ["차크닉", "주차장"],
                distance: "11.1km",
                image: "./images/main.png",
                latitude: 37.55273,
                longitude: 126.89954,
                bookmarked: false
            },
            {
                id: 2,
                name: "광교호수공원",
                address: "서울 마포구 망원동 205-4",
                tags: ["도심", "주차장"],
                distance: "26km",
                image: "./images/main-1.png",
                latitude: 37.28224,
                longitude: 127.06501,
                bookmarked: false
            },
            {
                id: 3,
                name: "강릉 안반데기",
                address: "대기리 2214-207",
                tags: ["오션뷰", "주차장"],
                distance: "108km",
                image: "./images/main-2.png",
                latitude: 37.61244,
                longitude: 128.73969,
                bookmarked: false
            },
            {
                id: 4,
                name: "화성 궁평항",
                address: "경기도 화성시 서신면 궁평항로 1049-24",
                tags: ["차크닉", "주차장"],
                distance: "58km",
                image: "./images/main-3.png",
                latitude: 37.11547,
                longitude: 126.68273,
                bookmarked: false
            },
            {
                id: 5,
                name: "서귀포 돈내코",
                address: "제주특별자치도 서귀포시 돈내코로 114",
                tags: ["이색", "주차장"],
                distance: "483km",
                image: "./images/main-4.png",
                latitude: 33.30048,
                longitude: 126.58261,
                bookmarked: false
            },
            {
                id: 6,
                name: "영종도 마시안해변",
                address: "덕교동 662-9",
                tags: ["수도권", "주차장"],
                distance: "32km",
                image: "./images/main-5.png",
                latitude: 37.43258,
                longitude: 126.41591,
                bookmarked: false
            }
        ];

        const searchScreen =
            document.getElementById("searchScreen");

        const mapScreen =
            document.getElementById("mapScreen");

        const resultList =
            document.getElementById("resultList");

        const mapBackButton =
            document.getElementById("mapBackButton");

        const mapElement =
            document.getElementById("map");

        let kakaoMap = null;
        let placeMarker = null;
        let selectedPlace = null;

        /**
         * 장소 목록 생성
         */
        function renderPlaces() {
            resultList.innerHTML = "";

            places.forEach(function (place) {
                const placeButton =
                    document.createElement("button");

                placeButton.type = "button";
                placeButton.className = "result-item";
                placeButton.setAttribute(
                    "aria-label",
                    place.name + " 지도 열기"
                );

                placeButton.innerHTML = `
                    <div class="place-image">
                        <img
                            src="${place.image}"
                            alt="${place.name}"
                        >
                    </div>

                    <div class="place-info">
                        <h2 class="place-name">
                            ${place.name}
                        </h2>

                        <p class="place-address">
                            ${place.address}
                        </p>

                        <div class="place-option">
                            <div class="tag-list">
                                ${place.tags.map(function (tag) {
                                    return `
                                        <span class="tag">
                                            ${tag}
                                        </span>
                                    `;
                                }).join("")}
                            </div>

                            <span class="distance">
                                ${place.distance}
                            </span>
                        </div>
                    </div>

                    <span
                        class="bookmark"
                        role="button"
                        tabindex="0"
                        aria-label="${place.name} 저장"
                        data-place-id="${place.id}"
                    >
                        <img
                            src="${
                                place.bookmarked
                                    ? "./images/icons.svg"
                                    : "./images/icons.svg"
                            }"
                            alt=""
                        >
                    </span>
                `;

                placeButton.addEventListener(
                    "click",
                    function () {
                        openMap(place.id);
                    }
                );

                const bookmarkButton =
                    placeButton.querySelector(".bookmark");

                bookmarkButton.addEventListener(
                    "click",
                    function (event) {
                        event.stopPropagation();
                        toggleBookmark(place.id);
                    }
                );

                bookmarkButton.addEventListener(
                    "keydown",
                    function (event) {
                        if (
                            event.key === "Enter" ||
                            event.key === " "
                        ) {
                            event.preventDefault();
                            event.stopPropagation();
                            toggleBookmark(place.id);
                        }
                    }
                );

                resultList.appendChild(placeButton);
            });
        }

        /**
         * 북마크 상태 변경
         */
        function toggleBookmark(placeId) {
            const place = places.find(function (item) {
                return item.id === placeId;
            });

            if (!place) {
                return;
            }

            place.bookmarked = !place.bookmarked;

            renderPlaces();
        }

        /**
         * 지도 화면 열기
         */
        function openMap(placeId) {
            const place = places.find(function (item) {
                return item.id === placeId;
            });

            if (!place) {
                return;
            }

            selectedPlace = place;

            searchScreen.classList.add("hide");
            mapScreen.classList.add("show");

            window.setTimeout(function () {
                loadKakaoMap(place);
            }, 350);

            history.pushState(
                {
                    screen: "map"
                },
                "",
                "#map"
            );
        }

        /**
         * 검색 결과로 돌아가기
         */
        function closeMap() {
            mapScreen.classList.remove("show");
            searchScreen.classList.remove("hide");

            if (location.hash === "#map") {
                history.replaceState(
                    null,
                    "",
                    location.pathname + location.search
                );
            }
        }

        /**
         * 카카오맵 불러오기
         */
        function loadKakaoMap(place) {
            if (
                typeof window.kakao === "undefined" ||
                !window.kakao.maps
            ) {
                showMapError();
                return;
            }

            kakao.maps.load(function () {
                if (!kakaoMap) {
                    createMap(place);
                } else {
                    moveMap(place);
                }
            });
        }

        /**
         * 최초 지도 생성
         */
        function createMap(place) {
            const centerPosition =
                new kakao.maps.LatLng(
                    place.latitude,
                    place.longitude
                );

            const options = {
                center: centerPosition,
                level: 4
            };

            kakaoMap = new kakao.maps.Map(
                mapElement,
                options
            );

            createMarker(place);

            window.setTimeout(function () {
                kakaoMap.relayout();
                kakaoMap.setCenter(centerPosition);
            }, 100);
        }

        /**
         * 선택한 장소로 지도 이동
         */
        function moveMap(place) {
            const position =
                new kakao.maps.LatLng(
                    place.latitude,
                    place.longitude
                );

            kakaoMap.relayout();
            kakaoMap.setLevel(4);
            kakaoMap.setCenter(position);

            createMarker(place);

            window.setTimeout(function () {
                kakaoMap.relayout();
                kakaoMap.setCenter(position);
            }, 100);
        }

        /**
         * 기본 카카오맵 마커 생성
         *
         * 별도의 마커 이미지를 사용하려면
         * kakao.maps.MarkerImage를 설정하면 됩니다.
         */
        function createMarker(place) {
            if (placeMarker) {
                placeMarker.setMap(null);
            }

            const markerPosition =
                new kakao.maps.LatLng(
                    place.latitude,
                    place.longitude
                );

            placeMarker = new kakao.maps.Marker({
                map: kakaoMap,
                position: markerPosition,
                title: place.name
            });
        }

        /**
         * 지도 API 로딩 실패 안내
         */
        function showMapError() {
            mapElement.innerHTML = `
                <div class="map-error">
                    카카오맵을 불러오지 못했습니다.<br><br>
                    코드의 YOUR_JAVASCRIPT_KEY를<br>
                    본인의 JavaScript 키로 변경하고,<br>
                    실행 중인 사이트 도메인을 등록해주세요.
                </div>
            `;
        }

        mapBackButton.addEventListener(
            "click",
            function () {
                closeMap();
            }
        );

        window.addEventListener(
            "popstate",
            function () {
                if (
                    mapScreen.classList.contains("show")
                ) {
                    closeMap();
                }
            }
        );

        renderPlaces();
    </script>
</body>
</html>
