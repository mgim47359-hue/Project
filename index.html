<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24시간 lotta</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <!-- ========================================
         24시간 LOTTA HEADER
         전체 너비 100% / inner 1150px / 높이 63px
    ========================================= -->
    <header class="lotta-header">
        <div class="lotta-header__inner">
            <!-- 로고: 이미지는 ./images/이미지파일명 형태로 교체 가능 -->
            <h1 class="lotta-logo">
                <a href="#" aria-label="24시간 lotta 홈">
                    <img src="./images/lotte-eatz-logo.png" alt="24시간 lotta">
                </a>
            </h1>

            <!-- 메인 메뉴 -->
            <nav class="lotta-nav" aria-label="주요 메뉴">
                <ul class="lotta-nav__list">
                    <li><a href="#">브랜드</a></li>
                    <li><a href="#">쿠폰</a></li>
                    <li><a href="#">쇼핑</a></li>
                    <li><a href="#">이벤트</a></li>
                    <li><a href="#">고객지원</a></li>
                </ul>
            </nav>

            <!-- 우측 액션 영역 -->
            <div class="lotta-actions">
                <a class="lotta-bag" href="#" aria-label="장바구니">
                    <img src="./images/lotte-eatz-logo (1).png" alt="">
                </a>

                <a class="lotta-order" href="#">
                    <img src="./images/69b0ddbb-2ca8-4ec7-aba3-5f96d1bca3ee.png" alt="">
                    <span>주문하기</span>
                </a>
            </div>
        </div>
    </header>
<!-- =========================================
     메인 배너 + EATZ 마일
========================================= -->

<style>
    /* 전체 영역 */
    .lotta-main-banner {
        width: 1150px;
        margin: 50px auto;

        display: flex;
        align-items: flex-start;
        gap: 20px;
    }


    /* =========================
       왼쪽 슬라이더
    ========================= */

    .lotta-main-slider {
        position: relative;

        width: 814px;
        height: 351px;

        overflow: hidden;

        border-radius: 20px;
        background: #d91e34;
    }


    .lotta-main-slide {
        position: absolute;

        top: 0;
        left: 0;

        width: 100%;
        height: 100%;

        opacity: 0;
        visibility: hidden;

        transition: 0.5s;
    }


    /* 현재 슬라이드 */
    .lotta-main-slide.on {
        opacity: 1;
        visibility: visible;
    }


    .lotta-main-slide img {
        display: block;

        width: 100%;
        height: 100%;

        object-fit: cover;
    }


    /* =========================
       슬라이더 버튼
    ========================= */

    .lotta-main-control {
        position: absolute;

        right: 70px;
        bottom: 20px;

        z-index: 100;

        height: 38px;

        padding: 0 12px;

        display: flex;
        align-items: center;
        gap: 8px;

        border-radius: 50px;

        background: rgba(92, 0, 15, 0.85);
        color: #fff;
    }


    .lotta-main-control button {
        border: none;

        background: transparent;
        color: #fff;

        font-size: 18px;

        cursor: pointer;
    }


    .lotta-main-count {
        font-size: 14px;
        font-weight: 700;
    }


    /* + 버튼 */

    .lotta-main-plus {
        position: absolute;

        right: 24px;
        bottom: 20px;

        z-index: 100;

        width: 38px;
        height: 38px;

        border: none;
        border-radius: 50%;

        background: rgba(92, 0, 15, 0.85);
        color: #fff;

        font-size: 25px;

        cursor: pointer;
    }


    /* =========================
       오른쪽 EATZ 마일
    ========================= */

    .lotta-mile {
        width: 290px;
        height: 354px;

        padding: 28px 24px;

        flex-shrink: 0;

        border-radius: 20px;

        background: #414141;
        color: #fff;
    }


    /* 제목 */

    .lotta-mile-title {
        display: flex;
        align-items: center;

        font-size: 16px;
        font-weight: 700;
    }


    .lotta-mile-icon {
        width: 20px;
        height: 20px;

        margin-right: 6px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 50%;

        background: #ffd600;
        color: #fff;

        font-size: 12px;
        font-weight: 900;
    }


    .lotta-mile-arrow {
        margin-left: 8px;

        font-size: 28px;

        line-height: 1;
    }


    /* =========================
       쿠폰 / 스탬프
    ========================= */

    .lotta-mile-tab {
        width: 242px;
        height: 42px;

        margin-top: 20px;

        display: flex;
        align-items: center;

        border-radius: 10px;

        background: #595959;
    }


    .lotta-mile-tab button {
        width: 50%;
        height: 100%;

        border: none;

        background: transparent;
        color: #fff;

        font-size: 14px;
        font-weight: 600;

        cursor: pointer;
    }


    .lotta-mile-tab-line {
        width: 1px;
        height: 22px;

        background: #444;
    }


    /* =========================
       멤버십 박스
    ========================= */

    .lotta-membership {
        position: relative;

        width: 242px;
        height: 212px;

        margin-top: 8px;

        padding: 16px 12px;

        border-radius: 10px;

        background: #595959;
    }


    .lotta-membership-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
    }


    .lotta-membership-title strong {
        font-size: 15px;
    }


    .lotta-membership-title a {
        color: #bbb;

        font-size: 11px;

        text-decoration: none;
    }


    .lotta-membership p {
        margin-top: 18px;

        color: #fff;

        font-size: 13px;
        font-weight: 600;

        line-height: 1.7;
    }


    /* =========================
       하단 원형 아이콘
    ========================= */

    .lotta-brand-icons {
        position: absolute;

        left: 12px;
        bottom: 14px;

        display: flex;
    }


    .lotta-brand-icon {
        width: 29px;
        height: 29px;

        margin-right: -3px;

        display: flex;
        align-items: center;
        justify-content: center;

        border: 2px solid #454545;
        border-radius: 50%;

        font-size: 11px;
        font-weight: 900;
    }


    .lotta-brand-a {
        background: #eee9df;
        color: #333;
    }


    .lotta-brand-k {
        background: #2da46c;
        color: #fff;
    }


    .lotta-brand-l {
        background: #ef4639;
        color: #fff;
    }
</style>


<div class="lotta-main-banner">


    <!-- =====================================
         왼쪽 슬라이더
    ====================================== -->

    <div class="lotta-main-slider">


        <!-- 1번 -->
        <div class="lotta-main-slide on">

            <img
                src="./images/447c4af4-1188-4982-a554-941782b79a9e.png"
                alt="슬라이드 이미지 1"
            >

        </div>


        <!-- 2번 -->
        <div class="lotta-main-slide">

            <img
                src="./images/5741b051-963d-401e-b136-8913318a725f (1).png"
                alt="슬라이드 이미지 2"
            >

        </div>


        <!-- 3번 -->
        <div class="lotta-main-slide">

            <img
                src="./images/b1128ecd-76d9-42e2-b20a-37e5b81e2fd9.png"
                alt="슬라이드 이미지 3"
            >

        </div>


        <!-- 슬라이더 버튼 -->

        <div class="lotta-main-control">

            <!-- 이전 -->
            <button
                type="button"
                id="lottaPrev"
            >
                ‹
            </button>


            <!-- 페이지 번호 -->
            <span class="lotta-main-count">

                <strong id="lottaCurrent">
                    1
                </strong>

                /

                <span id="lottaTotal">
                    3
                </span>

            </span>


            <!-- 다음 -->
            <button
                type="button"
                id="lottaNext"
            >
                ›
            </button>


            <!-- 일시정지 -->
            <button
                type="button"
                id="lottaPause"
            >
                Ⅱ
            </button>

        </div>


        <!-- 더보기 -->
        <button
            type="button"
            class="lotta-main-plus"
        >
            +
        </button>


    </div>



    <!-- =====================================
         오른쪽 EATZ 마일
    ====================================== -->

    <div class="lotta-mile">


        <!-- 제목 -->

        <div class="lotta-mile-title">

            <span class="lotta-mile-icon">
                M
            </span>

            <strong>
                EATZ 마일
            </strong>

            <span class="lotta-mile-arrow">
                ›
            </span>

        </div>



        <!-- 쿠폰 / 스탬프 -->

        <div class="lotta-mile-tab">

            <button type="button">
                내 쿠폰
            </button>


            <span class="lotta-mile-tab-line"></span>


            <button type="button">
                스탬프
            </button>

        </div>



        <!-- 멤버십 -->

        <div class="lotta-membership">


            <div class="lotta-membership-title">

                <strong>
                    내 멤버십 등급
                </strong>

                <a href="#">
                    등급 혜택 안내 ›
                </a>

            </div>


            <p>
                로그인 하고<br>
                멤버십 등급 혜택을 받아보세요!
            </p>


            <!-- 하단 아이콘 -->

            <div class="lotta-brand-icons">

                <span class="lotta-brand-icon lotta-brand-a">
                    A
                </span>

                <span class="lotta-brand-icon lotta-brand-k">
                    K
                </span>

                <span class="lotta-brand-icon lotta-brand-l">
                    L
                </span>

            </div>


        </div>


    </div>


</div>



<!-- =========================================
     3초 자동 슬라이더
========================================= -->

<script>

document.addEventListener("DOMContentLoaded", function () {


    // 모든 슬라이드
    const slides =
        document.querySelectorAll(".lotta-main-slide");


    // 버튼
    const prev =
        document.getElementById("lottaPrev");

    const next =
        document.getElementById("lottaNext");

    const pause =
        document.getElementById("lottaPause");


    // 페이지 번호
    const currentText =
        document.getElementById("lottaCurrent");

    const totalText =
        document.getElementById("lottaTotal");


    let current = 0;

    let timer;

    let playing = true;


    // 전체 슬라이드 숫자
    totalText.textContent =
        slides.length;



    // =====================================
    // 슬라이드 보여주기
    // =====================================

    function showSlide(num) {


        if (num >= slides.length) {

            num = 0;

        }


        if (num < 0) {

            num = slides.length - 1;

        }


        // 모든 슬라이드 숨기기
        slides.forEach(function(slide) {

            slide.classList.remove("on");

        });


        // 현재 슬라이드 표시
        slides[num].classList.add("on");


        current = num;


        // 숫자 변경
        currentText.textContent =
            current + 1;

    }



    // =====================================
    // 자동재생
    // =====================================

    function autoPlay() {


        clearInterval(timer);


        timer = setInterval(function() {


            if (playing) {

                showSlide(current + 1);

            }


        }, 3000);

    }



    // =====================================
    // 이전 버튼
    // =====================================

    prev.addEventListener("click", function() {


        showSlide(current - 1);
