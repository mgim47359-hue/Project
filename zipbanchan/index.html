<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>집반찬</title>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>


    <!-- =========================================
         HEADER SECTION
    ========================================== -->
    <header class="header">

        <div class="header-inner">


            <!-- =========================================
                 SEARCH SECTION
            ========================================== -->
            <div class="header-search">

                <form
                    class="search-form"
                    action="#"
                    method="get"
                    role="search"
                >

                    <label
                        for="header-search-input"
                        class="blind"
                    >
                        상품 검색
                    </label>

                    <input
                        type="search"
                        id="header-search-input"
                        name="keyword"
                        placeholder="검색어를 입력해주세요"
                    >

                    <button
                        type="submit"
                        class="search-button"
                        aria-label="검색하기"
                    >
                        <img
                            src="./images/imgi_25_icon-search-f5f5f5-18.svg"
                            alt=""
                        >
                    </button>

                </form>

            </div>
            <!-- // SEARCH SECTION -->



            <!-- =========================================
                 LOGO SECTION
            ========================================== -->
            <h1 class="header-logo">

                <a href="./index.html">

                    <img
                        src="./images/imgi_11_logo_pc.svg"
                        alt="집반찬연구소"
                    >

                </a>

            </h1>
            <!-- // LOGO SECTION -->



            <!-- =========================================
                 RIGHT MENU SECTION
            ========================================== -->
            <div class="header-right">


                <!-- 회원 메뉴 -->
                <nav
                    class="member-menu"
                    aria-label="회원 메뉴"
                >

                    <ul>
                        <li>
                            <a href="#">로그인</a>
                        </li>

                        <li>
                            <a href="#">회원가입</a>
                        </li>

                        <li>
                            <a href="#">마이페이지</a>
                        </li>
                    </ul>

                </nav>


                <!-- 주요 메뉴 -->
                <nav
                    class="header-menu"
                    aria-label="주요 메뉴"
                >

                    <ul>

                        <li class="customer">

                            <img
                                src="./images/icon-phone.png"
                                alt=""
                            >

                            <a href="tel:15883754">
                                1588-3754
                            </a>

                        </li>

                        <li>
                            <a href="#">
                                배송조회
                            </a>
                        </li>

                        <li>
                            <a href="#">
                                공지사항
                            </a>
                        </li>

                        <li>
                            <a href="#">
                                장바구니
                            </a>
                        </li>

                    </ul>

                </nav>

            </div>
            <!-- // RIGHT MENU SECTION -->


        </div>

    </header>
    <!-- // HEADER SECTION -->

    <!-- =========================================
     HERO SECTION
     전체 너비 100% / 높이 500px
========================================== -->
<section class="hero-section" aria-labelledby="hero-title">

    <!-- =========================================
         HERO TEXT SECTION
    ========================================== -->
    

    <!-- =========================================
         HERO IMAGE SECTION
    ========================================== -->
    <div class="hero-image-wrap">

        <img
            src="./images/imgi_31_banner_6c144415eb989c40b109a3f1fdfc276e.jfif"
            alt="쭈꾸미와 미나리를 곁들인 파스타"
            class="hero-image"
        >

        <span class="new-badge">
            신제품
        </span>

    </div>

</section>


</body>
</html>
