<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Menu Banner</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <section class="quick-menu">
    <div class="inner">
      <a href="#" class="menu-item reserve">
        <div class="text-box">
          <h2>RESERVE</h2>
          <p>예약하기</p>
          <span class="arrow"></span>
        </div>
        <div class="reserve-icon" aria-hidden="true">
          <span class="screen"><b>N</b></span>
          <span class="stand"></span>
        </div>
      </a>

      <a href="#" class="menu-item save-point">
        <div class="text-box">
          <h2>SAVE POINT</h2>
          <p>사후 적립</p>
          <span class="arrow"></span>
        </div>
        <div class="point-icon" aria-hidden="true"><span>P</span></div>
      </a>

      <a href="#" class="menu-item delivery">
        <div class="text-box">
          <h2>DELIVERY</h2>
          <p>딜리버리</p>
          <span class="arrow"></span>
        </div>
        <div class="delivery-logo" aria-hidden="true">
          <strong>OUTBACK</strong>
          <span>Delivery</span>
        </div>
      </a>
    </div>
  </section>
</body>
</html>
