<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>배너 박스 배치</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      padding-top: 5px;
      background-color: #ffffff;
    display: flex;

    gap: 20PX;
    

    /* 부모 박스 */
    .parent-box {
      width: 1000px;
      height: 500px;

      display: flex;
      justify-content: space-between;
      align-items: flex-start;

      margin: 0 auto;
      padding: 2px 1px 0;

      /* 시안에 맞게 4px로 수정 */
      border: 4px solid #0000ff;
    }

    /* 자식 박스 */
    .child-box {
      width: 300px;
      height: 200px;

      border: 4px solid #000000;
    }

    .child-box p {
      color: #333333;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="parent-box">
    <div class="child-box">
      <p>배너1</p>
    </div>

    <div class="child-box">
      <p>배너2</p>
    </div>

    <div class="child-box">
      <p>배너3</p>
    </div>
  </div>
</body>
</html>
