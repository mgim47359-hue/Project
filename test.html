<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I.O.I 멤버</title>
</head>
<body>
    <script>
        // I.O.I 멤버를 배열에 저장
        let members = [
            "김세정",
            "전소미",
            "청하",
            "주결경",
            "김소혜",
            "정채연",
            "강미나",
            "최유정",
            "김도연",
            "임나영",
            "연정"
        ];

        // 전체 멤버를 한 줄로 출력
        document.write(
            `I.O.I 멤버는 ${members.join(", ")}입니다`
        );

        // 가로줄 출력
        document.write("<hr>");

        // 멤버 이름을 한 명씩 줄바꿈하여 출력
        for (let i = 0; i < members.length; i++) {
            document.write(`${members[i]}<br>`);
        }

        // 가로줄 출력
        document.write("<hr>");

        // 솔로로 데뷔한 멤버 출력
        document.write(
            `멤버 중 솔로로 데뷔한 멤버는 ${members[0]}입니다<br>`
        );

        document.write(
            `멤버 중 솔로로 데뷔한 멤버는 ${members[2]}입니다<br>`
        );

        document.write(
            `멤버 중 솔로로 데뷔한 멤버는 ${members[1]}입니다`
        );
    </script>
</body>
</html>
