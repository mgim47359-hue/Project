<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />
  <title>차박 장소 검색</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-width: 320px;
      min-height: 100%;
      font-family: Arial, "Noto Sans KR", sans-serif;
      color: #111;
      background: #fff;
    }

    button,
    a {
      font: inherit;
    }

    button {
      border: 0;
      background: none;
      cursor: pointer;
    }

    img {
      display: block;
      max-width: 100%;
    }

    .app {
      position: relative;
      width: 100%;
      height: 100svh;
      overflow: hidden;
      background: #fff;
    }

    /* ==============================
       검색 결과 화면
    ============================== */

    .search-screen {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100svh;
      background: #fff;
    }

    .top-header {
      position: relative;
      flex-shrink: 0;
      width: 100%;
      height: 80px;
      border-bottom: 1px solid #ededed;
      background: #fff;
    }

    .back-button {
      position: absolute;
      left: 22px;
      bottom: 17px;
      width: 28px;
      height: 28px;
    }

    .back-button img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .header-title {
      position: absolute;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      font-size: 18px;
      font-weight: 700;
      white-space: nowrap;
    }

    .place-list {
      flex: 1;
      overflow-y: auto;
      padding-bottom: 82px;
      scrollbar-width: none;
    }

    .place-list::-webkit-scrollbar {
      display: none;
    }

    .place-item {
      position: relative;
      display: grid;
      grid-template-columns: 100px minmax(0, 1fr) 28px;
      gap: 14px;
      width: 100%;
      min-height: 148px;
      padding: 24px 24px 22px;
      border-bottom: 1px solid #ededed;
      background: #fff;
      text-align: left;
    }

    .place-item:active {
      background: #f8f9fc;
    }

    .place-thumbnail {
      width: 100px;
      height: 100px;
      overflow: hidden;
      border-radius: 8px;
      background: #eee;
    }

    .place-thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .place-info {
      min-width: 0;
    }

    .place-name {
      margin-bottom: 4px;
      overflow: hidden;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .place-address {
      min-height: 39px;
      font-size: 13px;
      line-height: 1.45;
      color: #202020;
    }

    .place-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 12px;
    }

    .tag-group {
      display: flex;
      gap: 5px;
      min-width: 0;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 25px;
      padding: 0 10px;
      border-radius: 8px;
      background: #5876bc;
      color: #fff;
      font-size: 12px;
      white-space: nowrap;
    }

    .distance {
      margin-left: auto;
      color: #4566b2;
      font-size: 16px;
      font-weight: 500;
      white-space: nowrap;
    }

    .bookmark-button {
      align-self: start;
      width: 26px;
      height: 26px;
    }

    .bookmark-button img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* ==============================
       하단 메뉴
    ============================== */

    .bottom-nav {
      position: absolute;
      z-index: 20;
      left: 0;
      bottom: 0;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      width: 100%;
      height: 82px;
      border-top: 1px solid #ececec;
      background: #fff;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      color: #111;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
    }

    .nav-item img {
      width: 25px;
      height: 25px;
      object-fit: contain;
    }

    .nav-item.active {
      color: #5271b9;
    }

    /* ==============================
       지도 상세 화면
    ============================== */

    .map-screen {
      position: absolute;
      z-index: 30;
      inset: 0;
      display: none;
      width: 100%;
      height: 100svh;
      background: #fff;
    }

    .map-screen.active {
      display: block;
    }

    .map-area {
      position: absolute;
      inset: 0 0 147px;
      background: #dfe7ea;
    }

    #kakaoMap {
      width: 100%;
      height: 100%;
    }

    .map-back-button {
      position: absolute;
      z-index: 50;
      top: calc(env(safe-area-inset-top) + 38px);
      left: 22px;
      width: 30px;
      height: 30px;
      padding: 4px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.82);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .map-back-button img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .map-control-group {
      position: absolute;
      z-index: 50;
      right: 18px;
      bottom: 165px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .map-control-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border: 1px solid #e4e4e4;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.14);
    }

    .map-control-button img {
      width: 23px;
      height: 23px;
      object-fit: contain;
    }

    .selected-place-card {
      position: absolute;
      z-index: 45;
      left: 0;
      bottom: 0;
      display: grid;
      grid-template-columns: 100px minmax(0, 1fr) 28px;
      gap: 14px;
      width: 100%;
      min-height: 147px;
      padding: 22px 24px 20px;
      border-top: 1px solid #e6e6e6;
      background: #fff;
    }

    .selected-place-card .place-thumbnail {
      width: 100px;
      height: 100px;
    }

    .selected-card-actions {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 10px;
    }

    .route-button {
      height: 27px;
      padding: 0 11px;
      border-radius: 8px;
      background: #233f82;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
    }

    .route-button:active {
      opacity: 0.8;
    }

    .map-message {
      position: absolute;
      z-index: 60;
      top: calc(env(safe-area-inset-top) + 90px);
      left: 50%;
      display: none;
      max-width: calc(100% - 40px);
      padding: 10px 15px;
      transform: translateX(-50%);
      border-radius: 20px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      font-size: 13px;
      white-space: nowrap;
    }

    .map-message.show {
      display: block;
    }

    /* 화면 전환 애니메이션 */
    .map-screen.open-animation {
      animation: mapOpen 0.28s ease-out;
    }

    @keyframes mapOpen {
      from {
        opacity: 0;
        transform: translateX(25px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <!-- 검색 결과 화면 -->
    <section class="search-screen" id="searchScreen">
      <header class="top-header">
        <button class="back-button" type="button" aria-label="뒤로 가기">
          <img src="./images/icon-back.png" alt="" />
        </button>

        <h1 class="header-title">검색결과</h1>
      </header>

      <div class="place-list" id="placeList">
        <!-- JavaScript로 목록 생성 -->
      </div>

      <nav class="bottom-nav">
        <a href="./home.html" class="nav-item">
          <img src="./images/icon-home.png" alt="" />
          <span>홈</span>
        </a>

        <a href="./search.html" class="nav-item active">
          <img src="./images/icon-search-active.png" alt="" />
          <span>검색</span>
        </a>

        <a href="./group.html" class="nav-item">
          <img src="./images/icon-group.png" alt="" />
          <span>모임</span>
        </a>

        <a href="./live.html" class="nav-item">
          <img src="./images/icon-live.png" alt="" />
          <span>LIVE</span>
        </a>

        <a href="./mypage.html" class="nav-item">
          <img src="./images/icon-my.png" alt="" />
          <span>MY</span>
        </a>
      </nav>
    </section>

    <!-- 지도 상세 화면 -->
    <section class="map-screen" id="mapScreen">
      <div class="map-area">
        <div id="kakaoMap"></div>
      </div>

      <button
        type="button"
        class="map-back-button"
        id="mapBackButton"
        aria-label="검색 결과로 돌아가기"
      >
        <img src="./images/icon-back.png" alt="" />
      </button>

      <div class="map-control-group">
        <button
          type="button"
          class="map-control-button"
          id="currentLocationButton"
          aria-label="현재 위치 보기"
        >
          <img src="./images/icon-current-location.png" alt="" />
        </button>
      </div>

      <p class="map-message" id="mapMessage"></p>

      <article class="selected-place-card">
        <div class="place-thumbnail">
          <img id="selectedImage" src="" alt="" />
        </div>

        <div class="place-info">
          <h2 class="place-name" id="selectedName"></h2>
          <p class="place-address" id="selectedAddress"></p>

          <div class="place-bottom">
            <div class="selected-card-actions">
              <span class="tag" id="selectedTag"></span>
              <span class="tag">주차장</span>

              <button
                type="button"
                class="route-button"
                id="routeButton"
              >
                길찾기
              </button>
            </div>

            <strong class="distance" id="selectedDistance"></strong>
          </div>
        </div>

        <button
          type="button"
          class="bookmark-button"
          id="selectedBookmark"
          aria-label="즐겨찾기"
        >
          <img src="./images/icon-bookmark.png" alt="" />
        </button>
      </article>
    </section>
  </main>

  <!--
    YOUR_KAKAO_JAVASCRIPT_KEY 부분에
    카카오 개발자 사이트에서 발급받은 JavaScript 키를 입력하세요.
  -->
  <script
    src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=c1150e850c41fd7881e31f1d2ab6391e&autoload=false"
  ></script>

  <script>
    const places = [
      {
        id: 1,
        name: "망원한강공원",
        address: "서울 마포구 망원동 205-4",
        tag: "차크닉",
        distance: "11.1km",
        image: "./images/mangwon-hangang.jpg",
        latitude: 37.5524,
        longitude: 126.8994
      },
      {
        id: 2,
        name: "광교호수공원",
        address: "경기 수원시 영통구 광교호수로 165",
        tag: "도심",
        distance: "26km",
        image: "./images/gwanggyo-lake.jpg",
        latitude: 37.2839,
        longitude: 127.0654
      },
      {
        id: 3,
        name: "갈론 야반데기",
        address: "강원특별자치도 정선군 여량면",
        tag: "오션뷰",
        distance: "108km",
        image: "./images/galon-camping.jpg",
        latitude: 37.4577,
        longitude: 128.7318
      },
      {
        id: 4,
        name: "화성 궁평항",
        address: "경기도 화성시 서신면 궁평항로 1049-24",
        tag: "차크닉",
        distance: "58km",
        image: "./images/gungpyeong-port.jpg",
        latitude: 37.1159,
        longitude: 126.6827
      },
      {
        id: 5,
        name: "서귀포 돈내코",
        address: "제주특별자치도 서귀포시 돈내코로 114",
        tag: "이색",
        distance: "483km",
        image: "./images/donnaeko.jpg",
        latitude: 33.3003,
        longitude: 126.5838
      },
      {
        id: 6,
        name: "영종도 마시안해변",
        address: "인천광역시 중구 마시란로 662-9",
        tag: "수도권",
        distance: "32km",
        image: "./images/masian-beach.jpg",
        latitude: 37.4382,
        longitude: 126.4112
      }
    ];

    const placeList = document.getElementById("placeList");
    const searchScreen = document.getElementById("searchScreen");
    const mapScreen = document.getElementById("mapScreen");
    const mapBackButton = document.getElementById("mapBackButton");
    const currentLocationButton = document.getElementById(
      "currentLocationButton"
    );
    const routeButton = document.getElementById("routeButton");
    const mapMessage = document.getElementById("mapMessage");

    let kakaoMap = null;
    let placeMarker = null;
    let currentLocationMarker = null;
    let selectedPlace = null;
    let currentPosition = null;

    function renderPlaceList() {
      placeList.innerHTML = places
        .map((place) => {
          return `
            <article
              class="place-item"
              data-place-id="${place.id}"
              tabindex="0"
              role="button"
              aria-label="${place.name} 지도에서 보기"
            >
              <div class="place-thumbnail">
                <img
                  src="${place.image}"
                  alt="${place.name}"
                />
              </div>

              <div class="place-info">
                <h2 class="place-name">${place.name}</h2>
                <p class="place-address">${place.address}</p>

                <div class="place-bottom">
                  <div class="tag-group">
                    <span class="tag">${place.tag}</span>
                    <span class="tag">주차장</span>
                  </div>

                  <span class="distance">${place.distance}</span>
                </div>
              </div>

              <button
                type="button"
                class="bookmark-button"
                aria-label="${place.name} 즐겨찾기"
              >
                <img src="./images/icon-bookmark.png" alt="" />
              </button>
            </article>
          `;
        })
        .join("");
    }

    function handlePlaceClick(event) {
      const bookmarkButton = event.target.closest(".bookmark-button");

      if (bookmarkButton) {
        event.stopPropagation();
        toggleBookmark(bookmarkButton);
        return;
      }

      const placeItem = event.target.closest(".place-item");

      if (!placeItem) {
        return;
      }

      const placeId = Number(placeItem.dataset.placeId);
      const place = places.find((item) => item.id === placeId);

      if (place) {
        openMapScreen(place);
      }
    }

    function handlePlaceKeyboard(event) {
      if (event.key !== "Enter" && event.key !== " ") {
        return;
      }

      if (event.target.closest(".bookmark-button")) {
        return;
      }

      const placeItem = event.target.closest(".place-item");

      if (!placeItem) {
        return;
      }

      event.preventDefault();

      const placeId = Number(placeItem.dataset.placeId);
      const place = places.find((item) => item.id === placeId);

      if (place) {
        openMapScreen(place);
      }
    }

    function toggleBookmark(button) {
      const image = button.querySelector("img");
      const isActive = button.classList.toggle("active");

      image.src = isActive
        ? "./images/icon-bookmark-active.png"
        : "./images/icon-bookmark.png";
    }

    function openMapScreen(place) {
      selectedPlace = place;

      document.getElementById("selectedImage").src = place.image;
      document.getElementById("selectedImage").alt = place.name;
      document.getElementById("selectedName").textContent = place.name;
      document.getElementById("selectedAddress").textContent = place.address;
      document.getElementById("selectedTag").textContent = place.tag;
      document.getElementById("selectedDistance").textContent =
        place.distance;

      mapScreen.classList.add("active", "open-animation");
      searchScreen.setAttribute("aria-hidden", "true");

      initializeOrMoveMap(place);

      window.setTimeout(() => {
        mapScreen.classList.remove("open-animation");
      }, 300);
    }

    function closeMapScreen() {
      mapScreen.classList.remove("active");
      searchScreen.removeAttribute("aria-hidden");
    }

    function initializeOrMoveMap(place) {
      if (
        typeof kakao === "undefined" ||
        !kakao.maps
      ) {
        showMessage("카카오 지도 API 키를 확인해 주세요.");
        return;
      }

      kakao.maps.load(() => {
        const destination = new kakao.maps.LatLng(
          place.latitude,
          place.longitude
        );

        if (!kakaoMap) {
          const mapContainer = document.getElementById("kakaoMap");

          const mapOptions = {
            center: destination,
            level: 4
          };

          kakaoMap = new kakao.maps.Map(mapContainer, mapOptions);

          kakaoMap.addControl(
            new kakao.maps.ZoomControl(),
            kakao.maps.ControlPosition.RIGHT
          );
        } else {
          kakaoMap.setCenter(destination);
          kakaoMap.setLevel(4);
        }

        window.setTimeout(() => {
          kakaoMap.relayout();
          kakaoMap.setCenter(destination);
        }, 50);

        createPlaceMarker(destination, place.name);
      });
    }

    function createPlaceMarker(position, placeName) {
      if (placeMarker) {
        placeMarker.setMap(null);
      }

      const markerImage = new kakao.maps.MarkerImage(
        "./images/icon-place-marker.png",
        new kakao.maps.Size(42, 52),
        {
          offset: new kakao.maps.Point(21, 52)
        }
      );

      placeMarker = new kakao.maps.Marker({
        position: position,
        map: kakaoMap,
        image: markerImage,
        title: placeName
      });

      const overlayContent = `
        <div style="
          padding:7px 10px;
          border-radius:7px;
          background:#ffffff;
          box-shadow:0 2px 8px rgba(0,0,0,.18);
          color:#111;
          font-size:13px;
          font-weight:700;
          white-space:nowrap;
        ">
          ${placeName}
        </div>
      `;

      const overlay = new kakao.maps.CustomOverlay({
        position: position,
        content: overlayContent,
        yAnchor: 2.9
      });

      overlay.setMap(kakaoMap);
    }

    function moveToCurrentLocation() {
      if (!navigator.geolocation) {
        showMessage("현재 위치 기능을 지원하지 않는 브라우저입니다.");
        return;
      }

      showMessage("현재 위치를 확인하고 있습니다.");

      navigator.geolocation.getCurrentPosition(
        (position) => {
          currentPosition = {
            latitude: position.coords.latitude,
            longitude: position.coords.longitude
          };

          const currentLatLng = new kakao.maps.LatLng(
            currentPosition.latitude,
            currentPosition.longitude
          );

          if (currentLocationMarker) {
            currentLocationMarker.setMap(null);
          }

          const currentMarkerImage = new kakao.maps.MarkerImage(
            "./images/icon-my-location-marker.png",
            new kakao.maps.Size(34, 34),
            {
              offset: new kakao.maps.Point(17, 17)
            }
          );

          currentLocationMarker = new kakao.maps.Marker({
            map: kakaoMap,
            position: currentLatLng,
            image: currentMarkerImage,
            title: "현재 위치"
          });

          kakaoMap.setCenter(currentLatLng);
          kakaoMap.setLevel(4);

          showMessage("현재 위치로 이동했습니다.");
        },
        (error) => {
          let message = "현재 위치를 불러올 수 없습니다.";

          if (error.code === error.PERMISSION_DENIED) {
            message = "위치 권한을 허용해 주세요.";
          } else if (error.code === error.POSITION_UNAVAILABLE) {
            message = "현재 위치 정보를 사용할 수 없습니다.";
          } else if (error.code === error.TIMEOUT) {
            message = "현재 위치 확인 시간이 초과되었습니다.";
          }

          showMessage(message);
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 30000
        }
      );
    }

    function startRouteNavigation() {
      if (!selectedPlace) {
        return;
      }

      if (!navigator.geolocation) {
        openDestinationRouteWithoutStart();
        return;
      }

      showMessage("현재 위치를 확인하고 있습니다.");

      navigator.geolocation.getCurrentPosition(
        (position) => {
          currentPosition = {
            latitude: position.coords.latitude,
            longitude: position.coords.longitude
          };

          const startLatitude = currentPosition.latitude;
          const startLongitude = currentPosition.longitude;
          const endLatitude = selectedPlace.latitude;
          const endLongitude = selectedPlace.longitude;

          /*
            카카오맵 모바일 웹 길찾기 URL
            sp = 출발지 좌표
            ep = 목적지 좌표
            by = car 자동차 길찾기
          */
          const routeUrl =
            "https://m.map.kakao.com/scheme/route" +
            `?sp=${startLatitude},${startLongitude}` +
            `&ep=${endLatitude},${endLongitude}` +
            "&by=car";

          window.location.href = routeUrl;
        },
        () => {
          openDestinationRouteWithoutStart();
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 30000
        }
      );
    }

    function openDestinationRouteWithoutStart() {
      const destinationName = encodeURIComponent(selectedPlace.name);

      const routeUrl =
        "https://map.kakao.com/link/to/" +
        `${destinationName},${selectedPlace.latitude},${selectedPlace.longitude}`;

      window.open(routeUrl, "_blank");
      showMessage("카카오맵에서 출발 위치를 선택해 주세요.");
    }

    function showMessage(message) {
      mapMessage.textContent = message;
      mapMessage.classList.add("show");

      window.clearTimeout(showMessage.timer);

      showMessage.timer = window.setTimeout(() => {
        mapMessage.classList.remove("show");
      }, 2500);
    }

    placeList.addEventListener("click", handlePlaceClick);
    placeList.addEventListener("keydown", handlePlaceKeyboard);

    mapBackButton.addEventListener("click", closeMapScreen);
    currentLocationButton.addEventListener(
      "click",
      moveToCurrentLocation
    );
    routeButton.addEventListener("click", startRouteNavigation);

    document
      .getElementById("selectedBookmark")
      .addEventListener("click", function () {
        toggleBookmark(this);
      });

    renderPlaceList();
  </script>
</body>
</html>
