<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="TMDB 기반 반응형 영화·TV 탐색 서비스 CINEVERSE" />
  <title>CINEVERSE — 영화와 시리즈</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header" id="header">
    <a class="logo" href="#home" aria-label="CINEVERSE 홈">CINEVERSE</a>
    <button class="menu-btn" id="menuBtn" aria-label="메뉴 열기" aria-expanded="false">☰</button>
    <nav class="nav" id="nav">
      <a href="#home">홈</a><a href="#popular">인기 콘텐츠</a><a href="#movies">영화</a><a href="#tv">시리즈</a>
    </nav>
    <form class="search" id="searchForm" role="search">
      <input id="searchInput" type="search" placeholder="제목을 검색하세요" aria-label="영화와 TV 검색" />
      <button aria-label="검색">⌕</button>
    </form>
  </header>

  <main>
    <section class="hero" id="home">
      <div class="hero-bg" id="heroBg"></div><div class="hero-video hidden" id="heroVideo" aria-hidden="true"></div><div class="hero-shade"></div>
      <div class="hero-content">
        <span class="eyebrow" id="heroType">오늘의 추천</span>
        <h1 id="heroTitle">영화의 세계가<br>여기서 시작됩니다</h1>
        <p class="hero-meta" id="heroMeta">NEW · 2026 · 12+</p>
        <p class="hero-overview" id="heroOverview">지금 가장 주목받는 작품과 새로운 이야기를 만나보세요.</p>
        <div class="hero-actions">
          <button class="btn primary" id="heroPlay">▶ 재생</button>
          <button class="btn secondary" id="heroInfo">ⓘ 상세 정보</button>
        </div>
      </div>
      <button class="hero-next" id="heroNext" aria-label="다음 추천">›</button>
    </section>

    <section class="notice hidden" id="notice"></section>
    <section class="search-results hidden" id="searchResults">
      <div class="section-head"><h2>검색 결과</h2><button id="closeSearch">전체 보기</button></div>
      <div class="grid" id="searchGrid"></div>
    </section>
    <div id="contentRows">
      <section class="row-section" id="popular"><div class="section-head"><h2>지금 뜨는 콘텐츠</h2></div><div class="slider-wrap"><button class="arrow left" data-target="popularRow">‹</button><div class="cards" id="popularRow"></div><button class="arrow right" data-target="popularRow">›</button></div></section>
      <section class="row-section" id="movies"><div class="section-head"><h2>현재 상영 중인 영화</h2></div><div class="slider-wrap"><button class="arrow left" data-target="movieRow">‹</button><div class="cards" id="movieRow"></div><button class="arrow right" data-target="movieRow">›</button></div></section>
      <section class="row-section" id="tv"><div class="section-head"><h2>인기 TV 시리즈</h2></div><div class="slider-wrap"><button class="arrow left" data-target="tvRow">‹</button><div class="cards" id="tvRow"></div><button class="arrow right" data-target="tvRow">›</button></div></section>
    </div>
  </main>

  <div class="modal hidden" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card"><button class="modal-close" id="modalClose" aria-label="닫기">×</button><div class="modal-image" id="modalImage"></div><div class="modal-body"><span class="match">추천도 높음</span><h2 id="modalTitle"></h2><p class="modal-meta" id="modalMeta"></p><p id="modalOverview"></p><button class="btn primary">▶ 재생</button></div></div>
  </div>

  <footer><div><a class="logo" href="#home">CINEVERSE</a><p>영화와 시리즈를 발견하는 가장 감각적인 방법.</p><small>© 2026 CINEVERSE. TMDB 데이터를 사용한 학습용 프로젝트입니다.</small></div><div class="footer-links"><a href="#popular">인기 콘텐츠</a><a href="#movies">영화</a><a href="#tv">TV 시리즈</a><a href="https://www.themoviedb.org/" target="_blank" rel="noreferrer">TMDB</a></div></footer>
  <script src="config.js"></script><script src="script.js"></script>
</body>
</html>
