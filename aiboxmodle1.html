<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Box Model</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:20px;
    background:#ffffff;
}

/* 부모 박스 */
.parent{
    width:1000px;
    height:500px;
    border:4px solid #0000ff;
    padding:4px 28px 0 4px;   /* 오른쪽 여백 확보 */
}

/* 상단 배너 영역 */
.banner-wrap{
    display:flex;
    gap:20px;
}

/* 자식 박스 */
.banner{
    width:300px;
    height:200px;
    border:4px solid #000;
    padding:4px;
    font-size:14px;
    font-family:"맑은 고딕", sans-serif;
}
</style>

</head>
<body>

<div class="parent">

    <div class="banner-wrap">

        <div class="banner">
            배너1
        </div>

        <div class="banner">
            배너2
        </div>

        <div class="banner">
            배너3
        </div>

    </div>

</div>

</body>
</html>
