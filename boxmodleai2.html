<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>박스 모델 2개</title>

  <style>
    * {
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      justify-content: center;
    }

    .parent-box {
      width: 1000px;
      height: 300px;
      border: 4px solid red;

      display: flex;
      justify-content: space-between;
    }

    .child-box {
      width: 480px;
      height: 300px;
      background-color: #e568e3;
    }
  </style>
</head>

<body>

  <div class="parent-box">
    <div class="child-box">박스1</div>
    <div class="child-box">박스2</div>
  </div>

</body>
</html>
