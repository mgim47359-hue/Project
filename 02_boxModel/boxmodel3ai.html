<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>박스 모델</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding-top: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 1000px;
      height: 300px;
      border: 5px solid #111;
      display: flex;
      background-color: yellow;
    }

    .box {
      flex: 1;
      height: 100%;
      padding: 4px;
      font-size: 12px;
    }

    .box + .box {
      border-left: 15px solid #f2f2f2;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="box">박스1</div>
    <div class="box">박스2</div>
    <div class="box">박스3</div>
  </div>
</body>
</html>
