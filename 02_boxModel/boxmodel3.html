<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>박스모델3</title>
    <style>
        *{margin: 0;padding: 0;}
        .box{
            width: 1000px;
            height: 300px;
            border: 5px solid #000;
            margin: 0 auto;
            display: flex;
            gap: 20px;

        }
        .box div{
            width: 320px;
            height: 300px;
            background-color: #ffff00;
            
        }
        ul li{
            width: 1000px;
            height: 300px;
            border: 5px solid #000;
            margin: 0 auto;
            display: flex;
            gap: 20px;
        }

        
    </style>
</head>
<body>
    <div class="box">
            <div>박스1</div>
            <div>박스2</div>
            <div>박스3</div>
            
    </div>



    <ul>
        <li>박스1</li>
        <li>박스2</li>
        <li>박스3</li>
    </ul>
    list-style: none;
    
    <script>
        
    </script>
</body>
</html>
