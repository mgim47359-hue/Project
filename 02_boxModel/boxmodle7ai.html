<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>박스 모델</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 0;
      background-color: #ffffff;
    }

    /* 전체 박스 */
    .container {
      width: 1000px;
      margin: 0 auto;
      border: 5px solid #000000;
    }

    /* 위쪽 박스 모델 - div 태그 */
    .top-box {
      display: flex;
      width: 100%;
      height: 300px;
      background-color: #edf7ff;
      border-bottom: 5px solid #000000;
    }

    .top-box div {
      flex: 1;
      height: 100%;
      border-right: 20px solid #ffffff;
    }

    .top-box div:last-child {
      border-right: 0;
    }

    /* 아래쪽 박스 모델 - 순서 없는 목록 */
    .bottom-box {
      display: flex;
      width: 100%;
      height: 300px;
      margin: 0;
      padding: 0;
      list-style: none;
      background-color: #ffb6c3;
    }

    .bottom-box li {
      flex: 1;
      height: 100%;
      border-right: 20px solid #ffffff;
    }

    .bottom-box li:last-child {
      border-right: 0;
    }
  </style>
</head>

<body>

  <section class="container">

    <!-- 위쪽: DIV 태그 사용 -->
    <section class="top-box">
      <div></div>
      <div></div>
      <div></div>
      <div></div>
    </section>

    <!-- 아래쪽: 순서 없는 목록 사용 -->
    <ul class="bottom-box">
      <li></li>
      <li></li>
      <li></li>
      <li></li>
    </ul>

  </section>

</body>
</html>
