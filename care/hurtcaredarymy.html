<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>마이페이지</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100svh;
      margin: 0;
      padding: 0;
    }

    body {
      overflow-x: hidden;
      background-color: #ffffff;
      color: #111111;
      font-family:
        Pretendard,
        "Noto Sans KR",
        Arial,
        sans-serif;
    }

    button,
    a {
      padding: 0;
      border: 0;
      background-color: transparent;
      color: inherit;
      font: inherit;
    }

    a {
      text-decoration: none;
    }

    img {
      display: block;
    }

    .app {
      position: relative;
      width: 100%;
      min-height: 100svh;
      padding-bottom: calc(106px + env(safe-area-inset-bottom));
      background-color: #ffffff;
    }

    /* 휴대폰 상태바 */

    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      height: 36px;
      padding:
        max(8px, env(safe-area-inset-top))
        24px
        0;
    }

    .status-time {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .signal-icon {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      width: 18px;
      height: 13px;
    }

    .signal-icon span {
      display: block;
      width: 3px;
      border-radius: 2px;
      background-color: #111111;
    }

    .signal-icon span:nth-child(1) {
      height: 4px;
    }

    .signal-icon span:nth-child(2) {
      height: 7px;
    }

    .signal-icon span:nth-child(3) {
      height: 10px;
    }

    .signal-icon span:nth-child(4) {
      height: 13px;
    }

    .wifi-icon {
      position: relative;
      width: 18px;
      height: 14px;
    }

    .wifi-icon::before {
      position: absolute;
      top: 0;
      left: 50%;
      width: 14px;
      height: 14px;
      border: 2px solid #111111;
      border-right-color: transparent;
      border-bottom-color: transparent;
      border-radius: 50%;
      content: "";
      transform: translateX(-50%) rotate(45deg);
    }

    .wifi-icon::after {
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background-color: #111111;
      content: "";
      transform: translateX(-50%);
    }

    .battery-icon {
      position: relative;
      width: 23px;
      height: 11px;
      border: 1.5px solid #111111;
      border-radius: 3px;
    }

    .battery-icon::before {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 5px;
      border-radius: 1px;
      background-color: #111111;
      content: "";
    }

    .battery-icon::after {
      position: absolute;
      top: 3px;
      right: -3px;
      width: 2px;
      height: 5px;
      border-radius: 0 2px 2px 0;
      background-color: #111111;
      content: "";
    }

    /* 헤더 */

    .header {
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;
      width: 100%;
      min-height: 76px;
      padding: 8px 37px 9px;
    }

    .header-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
    }

    .header-title {
      margin: 0;
      text-align: center;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .back-icon {
      position: relative;
      display: block;
      width: 21px;
      height: 21px;
    }

    .back-icon::before {
      position: absolute;
      top: 50%;
      left: 3px;
      width: 11px;
      height: 11px;
      border-left: 2px solid #111111;
      border-bottom: 2px solid #111111;
      content: "";
      transform: translateY(-50%) rotate(45deg);
    }

    .back-icon::after {
      position: absolute;
      top: 50%;
      left: 4px;
      width: 16px;
      height: 2px;
      background-color: #111111;
      content: "";
      transform: translateY(-50%);
    }

    .bell-icon {
      position: relative;
      display: block;
      width: 17px;
      height: 19px;
      border: 2px solid #111111;
      border-bottom: 0;
      border-radius: 10px 10px 2px 2px;
    }

    .bell-icon::before {
      position: absolute;
      right: -4px;
      bottom: -2px;
      left: -4px;
      height: 2px;
      border-radius: 5px;
      background-color: #111111;
      content: "";
    }

    .bell-icon::after {
      position: absolute;
      bottom: -6px;
      left: 50%;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background-color: #111111;
      content: "";
      transform: translateX(-50%);
    }

    /* 메인 */

    .main {
      width: 100%;
      padding: 0 28px 42px;
    }

    /* 프로필 영역 */

    .profile-card {
      display: grid;
      grid-template-columns: 77px 1fr;
      align-items: center;
      gap: 18px;
      width: 100%;
      min-height: 132px;
      padding: 17px 24px;
      border-radius: 8px;
      background-color: #fff3f5;
    }

    .profile-image {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      object-fit: cover;
    }

    .profile-content {
      min-width: 0;
    }

    .profile-name {
      margin: 0 0 4px;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .profile-message {
      margin: 0 0 10px;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.6px;
    }

    .profile-edit {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 22px;
      min-width: 126px;
      height: 29px;
      padding: 0 12px;
      border-radius: 999px;
      background-color: #ffffff;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .profile-edit-arrow {
      position: relative;
      display: block;
      width: 8px;
      height: 14px;
    }

    .profile-edit-arrow::before {
      position: absolute;
      top: 50%;
      left: 0;
      width: 7px;
      height: 7px;
      border-top: 1.5px solid #111111;
      border-right: 1.5px solid #111111;
      content: "";
      transform: translateY(-50%) rotate(45deg);
    }

    /* 메뉴 목록 */

    .menu-list {
      width: 100%;
    }

    .menu-item {
      display: grid;
      grid-template-columns: 34px 1fr 24px;
      align-items: center;
      width: 100%;
      min-height: 82px;
      padding: 0 17px;
      border-bottom: 1px solid #f3f3f3;
    }

    .menu-item:last-child {
      border-bottom: 0;
    }

    .menu-icon {
      position: relative;
      width: 25px;
      height: 25px;
    }

    .menu-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .menu-arrow {
      position: relative;
      display: block;
      width: 11px;
      height: 17px;
      justify-self: end;
    }

    .menu-arrow::before {
      position: absolute;
      top: 50%;
      left: 0;
      width: 7px;
      height: 7px;
      border-top: 1.3px solid #111111;
      border-right: 1.3px solid #111111;
      content: "";
      transform: translateY(-50%) rotate(45deg);
    }

    /* 내 정보 아이콘 */

    .user-icon::before {
      position: absolute;
      top: 1px;
      left: 7px;
      width: 10px;
      height: 10px;
      border: 2px solid #111111;
      border-radius: 50%;
      content: "";
    }

    .user-icon::after {
      position: absolute;
      bottom: 0;
      left: 3px;
      width: 18px;
      height: 10px;
      border: 2px solid #111111;
      border-bottom: 0;
      border-radius: 12px 12px 0 0;
      content: "";
    }

    /* 기록 보관함 아이콘 */

    .archive-icon {
      width: 17px;
      height: 20px;
      margin-left: 3px;
      border: 1.8px solid #111111;
      border-radius: 2px;
    }

    .archive-icon::before {
      position: absolute;
      top: 4px;
      left: 3px;
      width: 9px;
      height: 2px;
      background-color: #111111;
      content: "";
    }

    .archive-icon::after {
      position: absolute;
      top: 9px;
      left: 4px;
      width: 7px;
      height: 5px;
      border-top: 1.5px solid #111111;
      border-bottom: 1.5px solid #111111;
      content: "";
    }

    /* 알림 아이콘 */

    .notice-icon {
      width: 17px;
      height: 19px;
      margin-left: 3px;
      border: 2px solid #111111;
      border-bottom: 0;
      border-radius: 10px 10px 2px 2px;
    }

    .notice-icon::before {
      position: absolute;
      right: -4px;
      bottom: -2px;
      left: -4px;
      height: 2px;
      border-radius: 5px;
      background-color: #111111;
      content: "";
    }

    .notice-icon::after {
      position: absolute;
      bottom: -6px;
      left: 50%;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background-color: #111111;
      content: "";
      transform: translateX(-50%);
    }

    /* 보안 아이콘 */

    .security-icon::before {
      position: absolute;
      top: 7px;
      left: 4px;
      width: 17px;
      height: 14px;
      border-radius: 4px 4px 8px 8px;
      background-color: #111111;
      content: "";
    }

    .security-icon::after {
      position: absolute;
      top: 1px;
      left: 8px;
      width: 9px;
      height: 11px;
      border: 2px solid #111111;
      border-bottom: 0;
      border-radius: 7px 7px 0 0;
      content: "";
    }

    .security-dot {
      position: absolute;
      z-index: 2;
      top: 13px;
      left: 11px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background-color: #ffffff;
    }

    /* 공지 아이콘 */

    .speaker-icon::before {
      position: absolute;
      top: 7px;
      left: 2px;
      width: 8px;
      height: 10px;
      border: 2px solid #111111;
      border-radius: 2px;
      content: "";
    }

    .speaker-icon::after {
      position: absolute;
      top: 4px;
      left: 10px;
      width: 12px;
      height: 16px;
      background-color: #111111;
      clip-path: polygon(0 25%, 100% 0, 100% 100%, 0 75%);
      content: "";
    }

    .speaker-handle {
      position: absolute;
      bottom: 1px;
      left: 6px;
      width: 4px;
      height: 8px;
      border-radius: 0 0 2px 2px;
      background-color: #111111;
      transform: rotate(-12deg);
    }

    /* 하단 내비게이션 */

    .bottom-navigation {
      position: fixed;
      z-index: 30;
      right: 0;
      bottom: 0;
      left: 0;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      width: 100%;
      min-height: 106px;
      padding:
        17px
        13px
        calc(20px + env(safe-area-inset-bottom));
      border-top: 1px solid #ffe7eb;
      background-color: #ffffff;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 7px;
      min-width: 0;
      font-size: 11px;
      font-weight: 700;
    }

    .nav-icon {
      width: 24px;
      height: 24px;
      object-fit: contain;
      opacity: 0.45;
    }

    .nav-item.active .nav-icon {
      opacity: 1;
    }

    .home-indicator {
      position: fixed;
      z-index: 40;
      bottom: 3px;
      left: 50%;
      width: 132px;
      height: 5px;
      border-radius: 999px;
      background-color: #000000;
      transform: translateX(-50%);
    }
  </style>
</head>

<body>
  <div class="app">

    <div class="status-bar">
      <span class="status-time">9:41</span>

      <div class="status-icons">
        <span class="signal-icon" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </span>

        <span class="wifi-icon" aria-hidden="true"></span>
        <span class="battery-icon" aria-hidden="true"></span>
      </div>
    </div>

    <header class="header">

      <button
        class="header-button"
        type="button"
        aria-label="이전 화면"
      >
        <span class="back-icon"></span>
      </button>

      <h1 class="header-title">
        마이
      </h1>

      <button
        class="header-button"
        type="button"
        aria-label="알림"
      >
        <span class="bell-icon"></span>
      </button>

    </header>

    <main class="main">

      <section class="profile-card">

        <img
          class="profile-image"
          src="./imges/profile-image.png"
          alt="마음이 프로필 이미지"
        >

        <div class="profile-content">

          <h2 class="profile-name">
            마음이
          </h2>

          <p class="profile-message">
            나를 사랑하는 연습 중
          </p>

          <a
            class="profile-edit"
            href="#"
          >
            <span>프로필 편집</span>
            <span class="profile-edit-arrow"></span>
          </a>

        </div>

      </section>

      <nav
        class="menu-list"
        aria-label="마이페이지 메뉴"
      >

        <a
          class="menu-item"
          href="#"
        >
          <span class="menu-icon user-icon"></span>

          <span class="menu-title">
            내 정보
          </span>

          <span class="menu-arrow"></span>
        </a>

        <a
          class="menu-item"
          href="#"
        >
          <span class="menu-icon archive-icon"></span>

          <span class="menu-title">
            기록 보관함
          </span>

          <span class="menu-arrow"></span>
        </a>

        <a
          class="menu-item"
          href="#"
        >
          <span class="menu-icon notice-icon"></span>

          <span class="menu-title">
            알림 설정
          </span>

          <span class="menu-arrow"></span>
        </a>

        <a
          class="menu-item"
          href="#"
        >
          <span class="menu-icon security-icon">
            <span class="security-dot"></span>
          </span>

          <span class="menu-title">
            보안 설정
          </span>

          <span class="menu-arrow"></span>
        </a>

        <a
          class="menu-item"
          href="#"
        >
          <span class="menu-icon speaker-icon">
            <span class="speaker-handle"></span>
          </span>

          <span class="menu-title">
            공지사항
          </span>

          <span class="menu-arrow"></span>
        </a>

      </nav>

    </main>

    <nav
      class="bottom-navigation"
      aria-label="하단 메뉴"
    >

      <a
        class="nav-item"
        href="#"
      >
        <img
          class="nav-icon"
          src="./imges/home-icon.png"
          alt=""
        >
        <span>홈</span>
      </a>

      <a
        class="nav-item"
        href="#"
      >
        <img
          class="nav-icon"
          src="./imges/diary-icon.png"
          alt=""
        >
        <span>기록</span>
      </a>

      <a
        class="nav-item"
        href="#"
      >
        <img
          class="nav-icon"
          src="./imges/statistics-icon.png"
          alt=""
        >
        <span>통계</span>
      </a>

      <a
        class="nav-item"
        href="#"
      >
        <img
          class="nav-icon"
          src="./imges/recommend-icon.png"
          alt=""
        >
        <span>추천</span>
      </a>

      <a
        class="nav-item active"
        href="#"
      >
        <img
          class="nav-icon"
          src="./imges/mypage-icon.png"
          alt=""
        >
        <span>마이</span>
      </a>

    </nav>

    <div class="home-indicator"></div>

  </div>
</body>
</html>
