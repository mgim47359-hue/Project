<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>감정케어 다이어리 로그인</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100svh;
      margin: 0;
      padding: 0;
    }

    body {
      overflow-x: hidden;
      background-color: #ffffff;
      color: #111111;
      font-family:
        Pretendard,
        "Noto Sans KR",
        Arial,
        sans-serif;
    }

    button,
    input,
    a {
      color: inherit;
      font: inherit;
    }

    button {
      padding: 0;
      border: 0;
      background-color: transparent;
    }

    a {
      text-decoration: none;
    }

    img {
      display: block;
    }

    .app {
      position: relative;
      width: 100%;
      min-height: 100svh;
      padding-bottom: calc(31px + env(safe-area-inset-bottom));
      background-color: #ffffff;
    }

    /* 상태바 */

    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      height: 36px;
      padding:
        max(8px, env(safe-area-inset-top))
        24px
        0;
    }

    .status-time {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .signal-icon {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      width: 18px;
      height: 13px;
    }

    .signal-icon span {
      display: block;
      width: 3px;
      border-radius: 2px;
      background-color: #111111;
    }

    .signal-icon span:nth-child(1) {
      height: 4px;
    }

    .signal-icon span:nth-child(2) {
      height: 7px;
    }

    .signal-icon span:nth-child(3) {
      height: 10px;
    }

    .signal-icon span:nth-child(4) {
      height: 13px;
    }

    .wifi-icon {
      position: relative;
      width: 18px;
      height: 14px;
    }

    .wifi-icon::before {
      position: absolute;
      top: 0;
      left: 50%;
      width: 14px;
      height: 14px;
      border: 2px solid #111111;
      border-right-color: transparent;
      border-bottom-color: transparent;
      border-radius: 50%;
      content: "";
      transform: translateX(-50%) rotate(45deg);
    }

    .wifi-icon::after {
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background-color: #111111;
      content: "";
      transform: translateX(-50%);
    }

    .battery-icon {
      position: relative;
      width: 23px;
      height: 11px;
      border: 1.5px solid #111111;
      border-radius: 3px;
    }

    .battery-icon::before {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 5px;
      border-radius: 1px;
      background-color: #111111;
      content: "";
    }

    .battery-icon::after {
      position: absolute;
      top: 3px;
      right: -3px;
      width: 2px;
      height: 5px;
      border-radius: 0 2px 2px 0;
      background-color: #111111;
      content: "";
    }

    /* 메인 */

    .main {
      width: 100%;
      padding: 36px 44px 34px;
    }

    /* 로고 영역 */

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .brand-logo {
      width: 142px;
      height: 142px;
      object-fit: contain;
    }

    .brand-title {
      margin: 7px 0 8px;
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .brand-description {
      margin: 0;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.7;
      letter-spacing: -0.4px;
    }

    /* 로그인 폼 */

    .login-form {
      width: 100%;
      margin-top: 31px;
    }

    .input-box {
      display: grid;
      grid-template-columns: 56px 1fr 38px;
      align-items: center;
      width: 100%;
      height: 63px;
      margin-bottom: 50px;
      padding: 0 13px;
      border: 1px solid #d4d4d4;
      border-radius: 8px;
      background-color: #ffffff;
    }

    .input-field {
      width: 100%;
      height: 100%;
      padding: 0 8px;
      border: 0;
      outline: none;
      background-color: transparent;
      color: #111111;
      font-size: 14px;
    }

    .input-field::placeholder {
      color: #222222;
      opacity: 1;
    }

    /* 사용자 아이콘 */

    .user-icon {
      position: relative;
      display: block;
      width: 32px;
      height: 32px;
      margin-left: 6px;
    }

    .user-icon::before {
      position: absolute;
      top: 0;
      left: 10px;
      width: 12px;
      height: 12px;
      border: 1.6px solid #111111;
      border-radius: 50%;
      content: "";
    }

    .user-icon::after {
      position: absolute;
      bottom: 0;
      left: 3px;
      width: 26px;
      height: 13px;
      border: 1.6px solid #111111;
      border-bottom: 0;
      border-radius: 16px 16px 0 0;
      content: "";
    }

    /* 눈 아이콘 */

    .eye-icon {
      position: relative;
      display: block;
      width: 22px;
      height: 14px;
      margin: auto;
    }

    .eye-icon::before {
      position: absolute;
      inset: 0;
      border: 1px solid #bcbcbc;
      border-radius: 50%;
      content: "";
    }

    .eye-icon::after {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 5px;
      height: 5px;
      border: 1px solid #bcbcbc;
      border-radius: 50%;
      content: "";
      transform: translate(-50%, -50%);
    }

    /* 비밀번호 점 입력 */

    .password-row {
      display: grid;
      grid-template-columns: 56px 1fr;
      align-items: center;
      width: 100%;
      min-height: 43px;
      margin-bottom: 18px;
      padding: 0 23px;
    }

    .lock-icon {
      position: relative;
      display: block;
      width: 27px;
      height: 24px;
      border: 2px solid #111111;
      border-radius: 2px;
    }

    .lock-icon::before {
      position: absolute;
      top: -12px;
      left: 5px;
      width: 13px;
      height: 13px;
      border: 2px solid #111111;
      border-bottom: 0;
      border-radius: 8px 8px 0 0;
      content: "";
    }

    .lock-icon::after {
      position: absolute;
      top: 8px;
      left: 10px;
      width: 3px;
      height: 7px;
      border-radius: 2px;
      background-color: #111111;
      content: "";
    }

    .password-dots {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding-left: 2px;
    }

    .password-dot {
      width: 13px;
      height: 10px;
      border-radius: 50%;
      background-color: #d9d9d9;
    }

    /* 로그인 버튼 */

    .login-button {
      width: 100%;
      height: 61px;
      border-radius: 7px;
      background-color: #ff7d94;
      color: #ffffff;
      font-size: 15px;
      font-weight: 500;
    }

    /* 계정 찾기 */

    .account-links {
      display: grid;
      grid-template-columns: 1fr 1px 1fr;
      align-items: center;
      width: 100%;
      margin-top: 31px;
    }

    .account-link {
      text-align: center;
      font-size: 13px;
      font-weight: 500;
    }

    .account-divider {
      width: 1px;
      height: 26px;
      background-color: #c8c8c8;
    }

    /* 또는 */

    .or-divider {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 35px;
      width: 100%;
      margin: 37px 0 27px;
    }

    .or-line {
      height: 1px;
      background-color: #bfbfbf;
    }

    .or-text {
      font-size: 13px;
      font-weight: 500;
    }

    /* 소셜 로그인 */

    .social-list {
      display: grid;
      gap: 19px;
      width: 100%;
    }

    .social-item {
      display: grid;
      grid-template-columns: 55px 1fr;
      align-items: center;
      width: 100%;
      min-height: 42px;
    }

    .social-logo {
      width: 32px;
      height: 32px;
      margin: auto;
      object-fit: contain;
    }

    .social-text {
      text-align: center;
      font-size: 14px;
      font-weight: 500;
    }

    /* 회원가입 */

    .signup-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 43px;
      margin-top: 23px;
      font-size: 13px;
      font-weight: 500;
    }

    .signup-link {
      color: #ff5d7d;
    }

    /* 하단 인디케이터 */

    .home-indicator {
      position: fixed;
      z-index: 20;
      bottom: 3px;
      left: 50%;
      width: 132px;
      height: 5px;
      border-radius: 999px;
      background-color: #000000;
      transform: translateX(-50%);
    }
  </style>
</head>

<body>
  <div class="app">

    <div class="status-bar">
      <span class="status-time">9:41</span>

      <div class="status-icons">
        <span class="signal-icon" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </span>

        <span class="wifi-icon" aria-hidden="true"></span>
        <span class="battery-icon" aria-hidden="true"></span>
      </div>
    </div>

    <main class="main">

      <section class="brand">

        <img
          class="brand-logo"
          src="./imges/login-logo.png"
          alt="감정케어 다이어리 로고"
        >

        <h1 class="brand-title">
          감정케어 다이어리
        </h1>

        <p class="brand-description">
          하루의 감정을 기록하고,<br>
          나를 더 이해하는 시간
        </p>

      </section>

      <form class="login-form">

        <label class="input-box">

          <span
            class="user-icon"
            aria-hidden="true"
          ></span>

          <input
            class="input-field"
            type="text"
            aria-label="아이디"
          >

          <span
            class="eye-icon"
            aria-hidden="true"
          ></span>

        </label>

        <div
          class="password-row"
          aria-label="비밀번호가 입력된 상태"
        >

          <span
            class="lock-icon"
            aria-hidden="true"
          ></span>

          <div class="password-dots">
            <span class="password-dot"></span>
            <span class="password-dot"></span>
            <span class="password-dot"></span>
            <span class="password-dot"></span>
            <span class="password-dot"></span>
          </div>

        </div>

        <button
          class="login-button"
          type="submit"
        >
          로그인
        </button>

      </form>

      <nav
        class="account-links"
        aria-label="계정 찾기"
      >

        <a
          class="account-link"
          href="#"
        >
          아이디 찾기
        </a>

        <span class="account-divider"></span>

        <a
          class="account-link"
          href="#"
        >
          비밀번호 찾기
        </a>

      </nav>

      <div class="or-divider">
        <span class="or-line"></span>
        <span class="or-text">또는</span>
        <span class="or-line"></span>
      </div>

      <section
        class="social-list"
        aria-label="소셜 로그인"
      >

        <a
          class="social-item"
          href="#"
        >
          <img
            class="social-logo"
            src="./imges/google-logo.png"
            alt="Google"
          >

          <span class="social-text">
            Google로 로그인
          </span>
        </a>

        <a
          class="social-item"
          href="#"
        >
          <img
            class="social-logo"
            src="./imges/kakao-logo.png"
            alt="카카오"
          >

          <span class="social-text">
            카카오로 로그인
          </span>
        </a>

      </section>

      <div class="signup-row">

        <span>
          계정이 없으신가요?
        </span>

        <a
          class="signup-link"
          href="#"
        >
          회원가입
        </a>

      </div>

    </main>

    <div class="home-indicator"></div>

  </div>
</body>
</html>
