<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>요일 배열</title>
</head>
<body>
    <script>
        // 요일을 기억하는 배열 변수
        let week = ["월", "화", "수", "목", "금", "토", "일"];

        // 배열 번호는 0부터 시작하므로 화요일은 week[1]
        document.write(`오늘은 특별한 ${week[1]}요일 입니다!`);
    </script>
</body>
</html>
