<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>박스 모델</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    display:flex;
    justify-content:center;
    padding:20px;
}

/* 부모 박스 */
.wrap{
    width:1000px;
    height:300px;
    border:5px solid #000;
}

/* 자식 박스 */
.wrap ul{
    width:100%;
    height:100%;
    list-style:none;
    display:flex;
}

.wrap li{
    flex:1;
    background:#fff200;
    padding:4px;
    font-size:12px;
    color:#000;
}

/* 박스 사이 간격 */
.wrap li + li{
    margin-left:15px;
}
</style>
</head>

<body>

<div class="wrap">
    <ul>
        <li>박스1</li>
        <li>박스2</li>
        <li>박스3</li>
    </ul>
</div>

</body>
</html>
