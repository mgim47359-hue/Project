<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>표준 웹 기술</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 8px;
      font-family: Arial, sans-serif;
      background-color: #ffffff;
    }

    .web-box {
      width: 322px;
      border: 1px solid #000000;
      padding: 36px 12px;
    }

    h1 {
      margin: 0 0 36px;
      font-size: 30px;
      font-weight: bold;
      color: #000000;
    }

    p {
      margin: 0 0 36px;
      font-size: 22px;
      color: blue;
      line-height: 1;
    }

    p:last-child {
      margin-bottom: 0;
    }

    .first-letter {
      color: red;
      font-size: 50px;
      font-weight: normal;
      vertical-align: -5px;
    }
  </style>
</head>

<body>
  <div class="web-box">
    <h1>표준 웹 기술</h1>

    <p>
      <span class="first-letter">H</span>TML
    </p>

    <p>
      <span class="first-letter">C</span>SS
    </p>

    <p>
      <span class="first-letter">J</span>avascript
    </p>
  </div>
</body>
</html>
