<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>반복문 연습</title>
</head>

<body>

    <script>

        // 프런트 엔드 개발 프로그램은 HTML, CSS, JavaScript가 있다.
        // 반복문을 이용해서 웹브라우저에 10번 출력하기

        // 반복문 : for, while, do while

        for (let i = 1; i <= 100000; i++) {

            document.write(
                i + ". 프런트 엔드 개발 프로그램은 HTML, CSS, JavaScript가 있다.<br>"
            );

        }

    </script>

</body>

</html>
