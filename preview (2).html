<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>진달래 꽃</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>진달래 꽃</h1>

  <p class="author">지은이: 김소월</p>

  <p class="poem">
    나 보기가<br>
    역겨워<br>
    가실 때에는<br><br>

    말 없이<br>
    고이<br>
    보내 드리오리다<br><br>

    영변에<br>
    약산<br>
    진달래 꽃<br><br>

    진달래<br>
    진달래 꽃<br>
    피웠네
  </p>
</body>
</html>
