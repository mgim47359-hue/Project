<form id="contactForm">
  <input
    type="text"
    name="name"
    placeholder="이름"
    required
  >

  <input
    type="tel"
    name="phone"
    placeholder="연락처"
    required
  >

  <input
    type="email"
    name="email"
    placeholder="이메일"
    required
  >

  <button type="submit">
    신청하기
  </button>
</form>
