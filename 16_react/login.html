<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
<style
    
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #fff;
            font-family: Arial, sans-serif;
            color: #333;
        }

        .wrap {
            width: 750px;
            margin: 20px auto;
        }

        .result-title {
            font-size: 34px;
            font-weight: bold;
            margin: 0 0 18px 0;
        }

        .login-box {
            width: 750px;
            height: 565px;
            border: 1px solid #ddd;
            border-radius: 7px;

            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .login-inner {
            width: 420px;
            margin-top: 45px;
        }

        .login-title {
            text-align: center;
            font-size: 44px;
            font-weight: bold;
            margin: 0 0 35px 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 19px;
            margin-bottom: 10px;
        }

        .form-group input {
            width: 100%;
            height: 69px;
            border: 1px solid #ccc;
            padding: 0 15px;
            font-size: 18px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #555;
        }

        .login-btn {
            width: 100%;
            height: 64px;
            margin-top: 7px;

            border: 0;
            background: #2b2b2b;
            color: #fff;

            font-size: 19px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #111;
        }
    </style>
</head>

<body>

    <div class="wrap">

        <h1 class="result-title">실습 결과</h1>

        <div class="login-box">

            <form class="login-inner">

                <h2 class="login-title">로그인</h2>

                <div class="form-group">
                    <label for="userId">아이디</label>
                    <input type="text" id="userId">
                </div>

                <div class="form-group">
                    <label for="userPw">비밀번호</label>
                    <input type="password" id="userPw">
                </div>

                <button type="submit" class="login-btn">
                    로그인
                </button>

            </form>

        </div>

    </div>

</body>
</html>
