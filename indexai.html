<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Outback Quick Menu</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <section class="quick-menu">

        <div class="quick-inner">

            <!-- RESERVE -->
            <a href="#" class="quick-item reserve">
                <div class="quick-text">
                    <h2>RESERVE</h2>
                    <p>예약하기</p>

                    <span class="arrow"></span>
                </div>

                <span class="quick-image reserve-image"></span>
            </a>


            <!-- SAVE POINT -->
            <a href="#" class="quick-item save-point">
                <div class="quick-text">
                    <h2>SAVE POINT</h2>
                    <p>사후 적립</p>

                    <span class="arrow"></span>
                </div>

                <span class="quick-image point-image"></span>
            </a>


            <!-- DELIVERY -->
            <a href="#" class="quick-item delivery">
                <div class="quick-text">
                    <h2>DELIVERY</h2>
                    <p>딜리버리</p>

                    <span class="arrow"></span>
                </div>

                <span class="quick-image delivery-image"></span>
            </a>

        </div>

    </section>

</body>
</html>
